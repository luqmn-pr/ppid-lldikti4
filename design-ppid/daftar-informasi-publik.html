<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Informasi Publik - PPID LLDIKTI Wilayah IV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1d4294',
                        'primary-dark': '#153070',
                        secondary: '#ef9d34',
                        'secondary-dark': '#c47d25',
                        dark: '#0f172a',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="assets/css/global.css">
</head>

<body class="text-slate-800 antialiased overflow-x-hidden bg-slate-50">

    <div id="header-placeholder"></div>

    <!-- Page Header (Template) -->
    <div class="relative pt-32 pb-16 overflow-hidden bg-white border-b border-slate-100">
        <div class="absolute inset-0 bg-gradient-to-br from-blue-50 via-white to-orange-50 pointer-events-none"></div>
        <div class="absolute right-0 top-0 w-[500px] h-[400px] bg-blue-100 rounded-full blur-[120px] opacity-30 pointer-events-none -translate-y-1/2"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div class="flex items-center gap-2 text-sm text-slate-400 mb-6">
                <a href="index.html" class="hover:text-primary transition-colors">Beranda</a>
                <i class="ph ph-caret-right text-slate-300"></i>
                <a href="#" class="hover:text-primary transition-colors">Informasi Publik</a>
                <i class="ph ph-caret-right text-slate-300"></i>
                <span class="text-slate-600 font-medium">Daftar Informasi Publik</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 mb-4 uppercase tracking-tight">Daftar Informasi Publik</h1>
            <div class="w-12 h-1 bg-secondary rounded-full mb-4"></div>
            <p class="text-slate-500 max-w-xl text-base leading-relaxed">Dokumen lengkap mengenai daftar informasi publik yang tersedia dan dikelola oleh PPID LLDIKTI Wilayah IV.</p>
        </div>
    </div>

    <!-- Content Section -->
    <div class="py-12 bg-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="bg-slate-100 rounded-3xl p-2 border border-slate-200 shadow-inner h-[800px] relative overflow-hidden group">
                <!-- PDF Viewer Placeholder -->
                <iframe src="assets/docs/daftar-informasi-publik.pdf" class="w-full h-full rounded-2xl bg-white" title="Daftar Informasi Publik PDF">
                    <p class="text-center mt-20 text-slate-500">Browser Anda tidak mendukung iframe PDF. Silakan <a href="#" class="text-primary font-bold hover:underline">unduh PDF ini</a>.</p>
                </iframe>
                
                <!-- Fallback visual if no local PDF exists, wait, we can just show a nice placeholder if PDF fails -->
                <div class="absolute inset-0 flex flex-col items-center justify-center bg-white rounded-2xl -z-10 pointer-events-none">
                    <i class="ph-fill ph-file-pdf text-6xl text-slate-300 mb-4"></i>
                    <p class="text-slate-400 font-medium text-lg">Memuat dokumen PDF...</p>
                    <p class="text-sm text-slate-400 mt-2">(Jika tidak muncul, pastikan file PDF tersedia di server)</p>
                </div>
            </div>
            
            <div class="mt-6 flex justify-center">
                <a href="#" class="inline-flex items-center gap-2 bg-primary hover:bg-primary-dark text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-primary/20 transition-all hover:-translate-y-1">
                    <i class="ph-bold ph-download-simple text-xl"></i> Unduh Dokumen
                </a>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="assets/js/components.js"></script>
</body>

</html>
